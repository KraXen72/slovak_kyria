draw_config:
  dark_mode: true
  glyph_tap_size: 20
  # Keep long legends within the keycaps at the larger default font size.
  shrink_wide_legends: 6
  # Palette saturation is reduced by 35%, preserving hue and lightness.
  svg_extra_style: |
    svg.keymap {
      background-color: #1d242e;
      fill: #f8fafc;
    }

    svg.keymap use.glyph {
      color: #f8fafc;
      fill: none;
      stroke: currentColor;
    }

    rect.key {
      fill: #39424f;
    }

    rect.key,
    rect.combo {
      stroke: #6b7584;
    }

    rect.combo,
    rect.combo-separate {
      fill: #2e4d6a;
    }

    rect.held,
    rect.combo.held {
      fill: #85575e;
    }

    text.label,
    text.footer {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 5px;
      paint-order: stroke fill;
    }

    .trans,
    .none,
    .trans {
      opacity: 0.6;
    }
    svg.keymap {
      font-size: 16px;
    }

    text.shortcut.shifted {
      font-size: 14px;
    }

    /* Three rows at 14px fit inside a 52px keycap with 1.2em spacing. */
    text.chord.tap,
    text.rgb.tap {
      font-size: 14px;
    }

  # These are the original Lucide SVG paths, pinned to
  # lucide-icons/lucide@66d8f9fc394b8530377e5f6112f0b8908ba01280.
  # Wider media viewBoxes make those controls about 14% smaller.
