draw_config:
  dark_mode: true
  glyph_tap_size: 20
  svg_extra_style: |
    svg.keymap {
      background-color: #262a30;
    }

    svg.keymap use.glyph {
      color: #d1d6db;
      fill: none;
      stroke: currentColor;
    }

    .trans,
    .none,
    .trans {
      opacity: 0.6;
    }
    svg.keymap {
      font-size: 18px;
    }
    text.label,
    text.footer {
      stroke-width: 0;
    }

  # These are the original Lucide SVG paths, pinned to
  # lucide-icons/lucide@66d8f9fc394b8530377e5f6112f0b8908ba01280.
  glyphs:
    icon_arrow_up: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 7-7 7 7" />
        <path d="M12 19V5" />
      </svg>
    icon_arrow_down: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14" />
        <path d="m19 12-7 7-7-7" />
      </svg>
    icon_arrow_left: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
